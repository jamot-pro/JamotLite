name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The bundle must run on its own, with no node_modules next to it.
      - name: Bundle runs standalone
        run: |
          cp -R dist "$RUNNER_TEMP/jamot"
          cd "$RUNNER_TEMP/jamot"
          node jamot.mjs --version
          node jamot.mjs templates
      # The bundled Telegram client must reach Telegram, not hang (D38).
      - run: pnpm smoke

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jamot-lite:ci .
      - name: Container starts and reports its version
        run: docker run --rm jamot-lite:ci --version

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks CLI, not gitleaks-action: the action needs a paid licence
      # key on organization repositories.
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --verbose --redact
