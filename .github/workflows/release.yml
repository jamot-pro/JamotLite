name: Release

# Runs only when a maintainer pushes a version tag (v0.1.0 …).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Package
        run: |
          cd dist
          npm pack
          mv jamot-lite-*.tgz jamot-lite.tgz
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/jamot-lite.tgz scripts/install.sh --title "$GITHUB_REF_NAME" --generate-notes
      - name: Container image
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE=ghcr.io/jamot-pro/jamot-lite
          docker build -t "$IMAGE:${GITHUB_REF_NAME#v}" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
