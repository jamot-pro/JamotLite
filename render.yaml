# Jamot, run as a Jamot company, on Render — one service, one disk.
#
# Render dashboard → New → Blueprint → this repository, and fill in the values
# marked "sync: false". The first boot finds no company and opens the setup
# (RUNTIME D55): open the service's address, sign in with the password, and
# answer the interview there or on Telegram. Later boots just start it.
# To start from a company file instead, add JAMOT_TEMPLATE (for Jamot itself:
# /app/jamot.company.yaml).
# Recipe: docs/recipes/deploy-on-render.md
services:
  - type: web
    name: jamot
    runtime: docker
    plan: starter # a disk needs a paid plan
    region: singapore
    branch: main
    healthCheckPath: /health
    disk:
      name: jamot-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: JAMOT_BEHIND_PROXY
        value: "1"
      - key: JAMOT_TIMEZONE
        value: Asia/Makassar
      - key: JAMOT_MODEL
        value: anthropic/claude-sonnet-5
      # Read only on the first boot, then kept encrypted on the disk.
      # Delete them in the dashboard once the company is running.
      - key: JAMOT_PASSWORD
        sync: false
      - key: JAMOT_MODEL_KEY
        sync: false
      - key: JAMOT_TELEGRAM_TOKEN
        sync: false
